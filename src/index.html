<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>FRC Dashboard</title>
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <header>
        <!-- Tells whether robot is connected to dashboard. -->
        <div id="robot-state">Unknown state</div>
        <button id="connect-button">Connect</button>
    </header>
    <!-- You'll need to mess around with the CSS of #camera (found in css/style.css) to get it to work.
        More explanation in that CSS rule. -->
    <div class="camera" id="camera1">cam1</div>
    <div class="camera" id="camera2">cam2</div>
    <!-- The main body of the dashboard, by default contains the gyro monitor and the robot diagram -->
    <article>
        <div id="timer">2:15</div>
        <div class="h-container">
            <div class="info-container">
                <div class="info-label">Lunite Count:</div>
                <p class="info-text" id="luniteCt">0</p>
            </div>

            <div class="info-container">
                <div class="info-label">Current State:</div>
                <p class="info-text" id="currentState">IdleToIntake</p>
            </div>
        </div>
    </article>
    <!-- The sidebar of the dashboard. Designed for smaller control elements like selection boxes and small buttons. -->

    <!-- === NEW FIELD PANEL HTML === -->
    <div id="field-ui">
        <h2>Field Visualization</h2>

        <div id="field-wrapper">
            <canvas id="fieldCanvas" width="800" height="400"></canvas>
        </div>

        <div id="field-controls">
            <label>X Key:<select id="field-x-key">
                    <option>(mock)</option>
                </select></label>
            <label>Y Key:<select id="field-y-key">
                    <option>(mock)</option>
                </select></label>
            <label>Angle Key:<select id="field-angle-key">
                    <option>(mock)</option>
                </select></label>
            <button id="field-reset-btn">Reset</button>
        </div>
    </div>

    <div id="login">
        <input id="connect-address" type="text" value="localhost" disabled>
        <button id="connect" disabled>Connecting</button>
    </div>
    <script src="networktables/networktables.js"></script>
    <script src="ui.js"></script>
    <script src="connection.js"></script>
    <script src="../node_modules/@frc-web-components/frc-web-components/build/frc-web-components.min.js"></script>
    <script>
        webbitStore.addSourceProvider('NetworkTables');
        webbitStore.setDefaultSourceProvider('NetworkTables');
    </script>
    <script src="fieldview.js"></script>
</body>

</html>
